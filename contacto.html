    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <!-- Navegación -->
    <nav class="navbar">
        <div class="logo">MiPerfil<span>Profesional</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="sobremi.html">Sobre Mí</a></li>

            <li><a href="proyectos.html">Proyectos</a></li>
            <li><a href="contacto.html" class="active">Contacto</a></li>
        </ul>
    </nav>

    <main class="page-content bg-light">
        <section class="section">
            <h2>Contacto</h2>
            <p class="text-center">¿Tienes una propuesta laboral, consultoría o proyecto en mente? ¡Conversemos!</p>

            <div class="contact-wrapper">
                <div class="contact-details-box">
                    <h3>Canales Directos</h3>
                    <p><i class="fa-solid fa-envelope"></i> tu.correo@email.com</p>
                    <p><i class="fa-solid fa-phone"></i> +51 999 999 999</p>
                    <p><i class="fa-solid fa-location-dot"></i> Lima, Perú</p>
                </div>

                <div class="contact-form-box">
                    <form action="#" method="POST" class="contact-form">
                        <div class="form-group">
                            <label for="name">Nombre Completo</label>
                            <input type="text" id="name" required placeholder="Ej. María Pérez">
                        </div>
                        <div class="form-group">
                            <label for="email">Correo Electrónico</label>
                            <input type="email" id="email" required placeholder="nombre@correo.com">
                        </div>
                        <div class="form-group">
                            <label for="message">Mensaje</label>
                            <textarea id="message" rows="5" required placeholder="Escribe tu mensaje aquí..."></textarea>
                        </div>
                        <button type="submit" class="btn">Enviar Mensaje</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

</body>
